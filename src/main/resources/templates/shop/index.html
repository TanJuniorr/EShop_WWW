<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cửa hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row">
        <!-- Cột danh mục -->
        <aside class="col-md-3 mb-3">
            <div class="list-group">
                <a class="list-group-item list-group-item-action"
                   th:classappend="${categoryId == null} ? 'active'"
                   th:href="@{/products(keyword=${keyword})}">Tất cả</a>
                <a th:each="c : ${categories}" class="list-group-item list-group-item-action"
                   th:classappend="${c.id == categoryId} ? 'active'"
                   th:href="@{/products(categoryId=${c.id}, keyword=${keyword})}" th:text="${c.name}"></a>
            </div>
        </aside>

        <!-- Lưới sản phẩm -->
        <section class="col-md-9">
            <form th:if="${aiMaxLength != null}" id="shop-search" class="mb-3" method="get" th:action="@{/products}">
                <input th:if="${categoryId != null}" type="hidden" name="categoryId" th:value="${categoryId}">
                <label for="shop-search-query" class="form-label">Tìm kiếm AI</label>
                <div class="input-group">
                    <input id="shop-search-query" type="search" class="form-control" name="keyword"
                           th:value="${keyword}" th:maxlength="${aiMaxLength}"
                           placeholder="Ví dụ: Laptop phù hợp cho sinh viên lập trình">
                    <button type="submit" class="btn btn-primary">Tìm</button>
                </div>
                <p id="shop-search-loading" class="text-muted mt-2 mb-0" role="status" hidden>Đang tìm sản phẩm…</p>
            </form>
            <div th:if="${searchError}" class="alert alert-warning" role="alert" th:text="${searchError}"></div>
            <p th:unless="${searchError}" class="text-muted">
                <span th:text="${keyword == null ? 'Có' : 'Tìm thấy'}"></span> <b th:text="${resultCount}">0</b> sản phẩm
                <span th:if="${keyword}"> cho từ khoá "<b th:text="${keyword}"></b>"</span>
            </p>
            <p th:if="${keyword != null and searchError == null and resultCount == 0}" class="alert alert-light" role="status">
                Không tìm thấy sản phẩm phù hợp. Hãy thử cách diễn đạt khác hoặc đổi danh mục.
            </p>
            <div class="row row-cols-2 row-cols-lg-3 g-3">
                <div class="col" th:each="p : ${cards}">
                    <div class="card h-100 shadow-sm">
                        <a th:href="@{/products/{id}(id=${p.id})}"
                           th:attr="data-tracking-offer=${trackingOffer},data-tracking-product=${trackingOffer != null ? p.id : null}">
                            <img class="card-img-top product-img" th:src="${p.imageUrl}" th:alt="${p.name}">
                        </a>
                        <div class="card-body d-flex flex-column">
                            <small class="text-muted" th:text="${p.category.name}"></small>
                            <h6 class="card-title" th:text="${p.name}"></h6>
                            <div class="price mb-2" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></div>
                            <small class="text-muted mb-2" th:if="${p.quantity == 0}">Hết hàng</small>
                            <div class="mt-auto">
                                <form th:action="@{/cart/add}" method="post" class="d-inline"
                                      sec:authorize="!hasRole('SELLER')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    <button class="btn btn-sm btn-primary" th:disabled="${p.quantity == 0}">🛒 Thêm vào giỏ</button>
                                </form>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}(id=${p.id})}"
                                   th:attr="data-tracking-offer=${trackingOffer},data-tracking-product=${trackingOffer != null ? p.id : null}">Chi tiết</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="mt-4" th:if="${products != null and products.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link" th:href="@{/products(categoryId=${categoryId}, page=${i})}"
                           th:text="${i + 1}"></a>
                    </li>
                </ul>
            </nav>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/shop-search.js}" defer></script>
</body>
</html>
