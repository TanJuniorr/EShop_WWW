spring.application.name=eshop
server.port=8080

# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=${ESHOP_DB_USER:root}
# Đặt ESHOP_DB_PASSWORD trong Run Configuration của IntelliJ (hoặc dùng .env không được commit).
spring.datasource.password=${ESHOP_DB_PASSWORD:sapassword}

# ===== JPA / Hibernate =====
# Bang da duoc tao bang eShop.sql nen khong cho Hibernate tao/sua bang
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cho phep Thymeleaf doc quan he LAZY (vd: product.category.name)
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== JWT =====
# Khóa JWT dạng Base64 từ biến môi trường.
# Nếu chưa cấu hình, ứng dụng tạo khóa tạm khi khởi động (cookie cũ hết hiệu lực khi restart).
app.jwt.secret=${ESHOP_JWT_SECRET:}
# Thoi han token: 1 ngay
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
