spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.use-tls=false
eshop.ai.embedding.timeout-ms=10000
eshop.ai.semantic-search.enabled=true
eshop.ai.semantic-search.top-k=5
eshop.ai.semantic-search.threshold=0.55
eshop.ai.semantic-search.max-query-length=300
eshop.ai.semantic-search.qdrant-timeout-ms=3000
eshop.ai.semantic-search.max-concurrent=4
eshop.ai.semantic-search.requests-per-minute=60
